# Generated from config/models.env by tools/render_config.py.
# Copy to this device's CLIProxyAPI config path, then replace <AUTH_DIR> and
# <CLIENT_KEY>. Never commit or sync a filled copy: it carries a local key.
host: "127.0.0.1"
port: 8317

auth-dir: "<AUTH_DIR>"

remote-management:
  allow-remote: false
  secret-key: ""

api-keys:
  - "<CLIENT_KEY>"

# Alias IDs stay stable because the generated agent files reference them.
oauth-model-alias:
  codex:
    - name: "gpt-5.6-terra"
      alias: "claude-delegate-terra"
      display-name: "GPT 5.6 Terra"
    - name: "gpt-5.6-luna"
      alias: "claude-delegate-luna"
      display-name: "GPT 5.6 Luna"
    - name: "gpt-5.6-sol"
      alias: "claude-delegate-sol"
      display-name: "GPT 5.6 Sol"

oauth-excluded-models:
  claude:
    - "claude-3-*"
    - "*haiku*"
    - "claude-opus-4-1-20250805"
    - "claude-opus-4-20250514"
    - "claude-opus-4-5-20251101"
    - "claude-opus-4-6"
    - "claude-opus-4-7"
    - "claude-sonnet-4-20250514"
    - "claude-sonnet-4-5-20250929"
    - "claude-sonnet-4-6"
  codex:
    - "*codex*"
    - "gpt-image-*"
    - "gpt-5.4*"
    - "gpt-5.5"
